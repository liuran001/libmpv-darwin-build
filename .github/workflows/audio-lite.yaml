name: audio-lite

# 构建带音频滤镜的 audio-default libmpv（macOS arm64 + amd64 + universal xcframeworks），
# 并在 runner 上直接调用 libavfilter 的 avfilter_get_by_name() 做运行时滤镜核验。
# 不使用任何 secrets。

on:
  workflow_dispatch:
    inputs:
      targets:
        description: 'Space separated nix attrs'
        required: false
        default: 'mk-out-archive-libs-macos-arm64-audio-default mk-out-archive-libs-macos-amd64-audio-default mk-out-archive-xcframeworks-macos-universal-audio-default'
        type: string

jobs:
  build:
    name: Build audio-default libmpv (macOS)
    # https://github.com/actions/runner-images/blob/main/images/macos/macos-15-arm64-Readme.md
    runs-on: macos-15
    timeout-minutes: 340
    env:
      TARGETS: ${{ github.event.inputs.targets }}
    steps:
      - name: Platform info
        run: |
          printf "%-23s %s\n" "ProductVersion:" "$(/usr/bin/sw_vers -productVersion)"
          printf "%-23s %s\n" "Arch:" "$(uname -m)"
          sysctl -n hw.ncpu

      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          extra-conf: |
            sandbox = true
            sandbox-fallback = false

      - name: Nix version
        run: nix --version

      - uses: DeterminateSystems/magic-nix-cache-action@v13
        continue-on-error: true
        with:
          use-flakehub: false

      - name: Xcode path
        id: xcode_path
        run: |
          if [ -d /Applications/Xcode_16.1.0.app ]; then
            XCODE_PATH=$(realpath /Applications/Xcode_16.1.0.app)
          else
            XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort | tail -1)
            XCODE_PATH=$(realpath "$XCODE_PATH")
          fi
          echo "xcode_path=$XCODE_PATH" >> "$GITHUB_OUTPUT"
          "$XCODE_PATH/Contents/Developer/usr/bin/xcodebuild" -version

      - name: Build
        env:
          XCODE_PATH: ${{ steps.xcode_path.outputs.xcode_path }}
        run: |
          set -eux
          echo "$XCODE_PATH" > .nix/config/xcode.path
          for t in ${TARGETS:-mk-out-archive-libs-macos-arm64-audio-default}; do
            nix build -v -L \
              --option sandbox true \
              --option sandbox-fallback false \
              --option extra-sandbox-paths "$XCODE_PATH" \
              --out-link "result-$t" \
              ".#$t"
          done
          git checkout -- .nix/config/xcode.path || true

      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p out
          for d in result-*; do
            [ -e "$d" ] || continue
            cp -v "$d"/*.tar.gz out/ 2>/dev/null || true
          done
          ls -l out
          ( cd out && sha256sum *.tar.gz > SHA256SUMS.txt && ls -l *.tar.gz >> SHA256SUMS.txt && cat SHA256SUMS.txt )

      - name: Unpack libs and inspect dylibs
        if: always()
        run: |
          mkdir -p x evidence
          for arch in arm64 amd64; do
            t=$(ls out/libmpv-libs_*_macos-${arch}-audio-default.tar.gz 2>/dev/null | head -1 || true)
            if [ -n "$t" ]; then
              mkdir -p "x/$arch"
              tar -xzf "$t" -C "x/$arch" --strip-components 1
            fi
          done
          t=$(ls out/libmpv-xcframeworks_*.tar.gz 2>/dev/null | head -1 || true)
          if [ -n "$t" ]; then
            mkdir -p x/xcframeworks
            tar -xzf "$t" -C x/xcframeworks --strip-components 1
          fi

          : > evidence/dylibs.txt
          for arch in arm64 amd64; do
            [ -d "x/$arch" ] || continue
            echo "===== macOS $arch =====" >> evidence/dylibs.txt
            ls -l "x/$arch" >> evidence/dylibs.txt || true
            for f in "x/$arch"/libmpv.dylib "x/$arch"/libavfilter.dylib; do
              [ -f "$f" ] || continue
              echo "-- $(basename "$f") archs: $(lipo -archs "$f" 2>/dev/null || echo n/a)" >> evidence/dylibs.txt
            done
            otool -L "x/$arch/libmpv.dylib" >> evidence/dylibs.txt 2>/dev/null || true
          done
          if [ -d x/xcframeworks ]; then
            echo "===== xcframeworks =====" >> evidence/dylibs.txt
            ls x/xcframeworks >> evidence/dylibs.txt || true
            for f in x/xcframeworks/*.xcframework/*/*.framework/*; do
              case "$f" in
                *.framework/[A-Z]*) echo "-- $f archs: $(lipo -archs "$f" 2>/dev/null || echo n/a)" >> evidence/dylibs.txt ;;
              esac
            done
          fi
          cat evidence/dylibs.txt || true

      - name: Runtime filter probe against libavfilter
        if: always()
        run: |
          mkdir -p evidence probe
          cat > probe/probe.c <<'EOF'
          #include <stdio.h>
          extern void *avfilter_get_by_name(const char *name);
          int main(int argc, char **argv) {
              int bad = 0;
              for (int i = 1; i < argc; i++) {
                  void *f = avfilter_get_by_name(argv[i]);
                  printf("%-16s %s\n", argv[i], f ? "OK" : "MISSING");
                  if (!f) bad++;
              }
              return bad ? 1 : 0;
          }
          EOF
          FILTERS="volume alimiter afade aresample dynaudnorm loudnorm speechnorm acrossfade acompressor agate atempo bass treble highpass lowpass superequalizer pan channelmap ebur128 astats silencedetect silenceremove amix amerge asplit concat join aformat asetnsamples apad atrim equalizer overlay"
          : > evidence/filter-probe.txt
          for arch in arm64 amd64; do
            LIBDIR="$PWD/x/$arch"
            [ -d "$LIBDIR" ] || continue
            echo "===== macOS $arch =====" >> evidence/filter-probe.txt
            CLANG_ARCH=""
            [ "$arch" = "amd64" ] && CLANG_ARCH="-arch x86_64"
            if clang $CLANG_ARCH -O1 probe/probe.c -L"$LIBDIR" -lavfilter -lavcodec -lavformat -lavutil \
                 -lswresample -lswscale -lmbedcrypto -lmbedtls -lmbedx509 \
                 -Wl,-rpath,"$LIBDIR" -o "probe/probe-$arch" 2>>evidence/filter-probe.txt; then
              if [ "$arch" = "arm64" ]; then
                ./probe/probe-arm64 $FILTERS >> evidence/filter-probe.txt 2>&1 || echo "probe reported missing filters" >> evidence/filter-probe.txt
              else
                arch -x86_64 ./probe/probe-amd64 $FILTERS >> evidence/filter-probe.txt 2>&1 \
                  || echo "x86_64 probe not runnable (Rosetta unavailable or missing filter)" >> evidence/filter-probe.txt
              fi
            else
              echo "probe build failed for $arch" >> evidence/filter-probe.txt
            fi
          done
          cat evidence/filter-probe.txt

      - name: Secondary strings scan
        if: always()
        run: |
          : > evidence/filter-strings.txt
          for f in x/arm64/libavfilter.dylib x/amd64/libavfilter.dylib; do
            [ -f "$f" ] || continue
            echo "===== $f =====" >> evidence/filter-strings.txt
            for n in volume alimiter afade aresample dynaudnorm loudnorm speechnorm acrossfade \
                     acompressor agate atempo bass treble highpass lowpass superequalizer pan \
                     channelmap ebur128 astats silencedetect silenceremove amix amerge asplit \
                     concat join aformat asetnsamples apad atrim equalizer overlay; do
              if LC_ALL=C grep -aq -- "$n" "$f"; then echo "  $n present" >> evidence/filter-strings.txt
              else echo "  $n MISSING" >> evidence/filter-strings.txt; fi
            done
          done
          cat evidence/filter-strings.txt

      - name: Provenance
        if: always()
        run: |
          {
            echo "platform: apple (macOS audio-default)"
            echo "build repo: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY @ $GITHUB_SHA"
            echo "workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "runner: macos-15 (arm64)"
            echo "ffmpeg version: $(grep -A2 '^  ffmpeg = {' packages.lock.nix | sed -n 's/.*version = "\(.*\)";/\1/p')"
            echo "mpv version: $(grep -A2 '^  mpv = {' packages.lock.nix | sed -n 's/.*version = "\(.*\)";/\1/p')"
            echo "license mode: LGPL (no --enable-gpl/--enable-nonfree; mpv -Dgpl=false)"
            echo
            echo "--- packages.lock.nix (ffmpeg / mpv pins) ---"
            grep -n -A6 -E '^\s*(ffmpeg|mpv)\s*=' packages.lock.nix || true
            echo
            echo "--- patches applied to mpv (audio variant) ---"
            grep -E 'patches/mpv' nix/packages/mk-pkg-mpv/default.nix
            echo
            echo "--- ffmpeg audio filters added (nix/packages/mk-pkg-ffmpeg/meson.build) ---"
            sed -n '/audio_processing_filters = \[/,/^\]/p' nix/packages/mk-pkg-ffmpeg/meson.build
          } > out/PROVENANCE.txt
          cat out/PROVENANCE.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: libmpv-audio-lite-macos
          path: |
            out/*.tar.gz
            out/SHA256SUMS.txt
            out/PROVENANCE.txt
            evidence/*.txt
          if-no-files-found: warn
          retention-days: 30
